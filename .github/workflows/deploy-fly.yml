name: deploy-fly

# Manual deploy of the backend to Fly.io. Requires repo secret FLY_API_TOKEN.
# The monolith entrypoint is the gateway; until it lands, deploy a single service.
on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy (build-arg SERVICE)"
        default: identity
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: buf generate
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --config deploy/fly.toml --build-arg SERVICE=${{ inputs.service }} --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
