# Fly.io deployment for the HaloMail backend (monolith mode).
# Secrets are set with `fly secrets set …`, never committed here.
app = "halomail"
primary_region = "iad"

[build]
  dockerfile = "deploy/Dockerfile"

  [build.args]
    # "gateway" (monolith entrypoint) or a single service name.
    SERVICE = "gateway"

[env]
  APP_ENV = "production"
  HTTP_PORT = "8080"
  LOG_FORMAT = "json"
  OTEL_ENABLED = "true"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero when idle → $0 on the free allowance.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "get"
    path = "/healthz"
    interval = "15s"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
